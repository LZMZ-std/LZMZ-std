<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="275" viewBox="0 0 1100 275" role="img" aria-label="LZMZ terminal: whoami, stack, and developer focus">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c121b"/><stop offset="1" stop-color="#121d29"/></linearGradient><clipPath id="clip"><rect x="18" y="18" width="1064" height="239" rx="13"/></clipPath></defs>
<rect x="1" y="1" width="1098" height="273" rx="16" fill="url(#bg)" stroke="#2c3d4b" stroke-width="2"/>
<path d="M1 55H1099" stroke="#2c3d4b"/><circle cx="32" cy="28" r="5" fill="#50606c"/><circle cx="51" cy="28" r="5" fill="#50606c"/><circle cx="70" cy="28" r="5" fill="#50606c"/>
<text x="550" y="34" text-anchor="middle" font-family="monospace" font-size="16" fill="#8298a9">lzmz@workspace: ~</text>
